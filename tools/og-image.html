<!-- Share image template (1200x630). Open from the site folder at 1200x630, screenshot, save as assets/img/og-share.jpg.
     If you replace the image, give it a new file name and update og:image on every page, so Instagram and Facebook drop their old copy. -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #0c0c0e; color: #f3f2f8; font-family: "Hanken Grotesk", sans-serif; position: relative; overflow: hidden; }
  .photo { position: absolute; top: 0; right: 0; bottom: 0; width: 540px;
    background: url("../assets/img/graded/dean-speed-pegs.jpg") 50% 42% / cover no-repeat; opacity: .85;
    -webkit-mask-image: linear-gradient(to left, #000 40%, transparent 100%); mask-image: linear-gradient(to left, #000 40%, transparent 100%); }
  .logo { position: absolute; left: 76px; top: 72px; width: 240px; }
  h1 { position: absolute; left: 76px; bottom: 156px; margin: 0; font: 800 74px/0.92 "Archivo", sans-serif; font-stretch: 118%;
    text-transform: uppercase; letter-spacing: -0.02em; }
  h1 span { color: #9d6bff; }
  .meta { position: absolute; left: 76px; bottom: 76px; right: 76px; margin: 0; display: flex; gap: 40px; font-size: 21px; color: #cfcde0; }
  .meta b { font-weight: 600; color: #3df5b4; }
  .c { position: absolute; width: 34px; height: 34px; border: 0 solid #3df5b4; }
  .tl { left: 30px; top: 30px; border-left-width: 3px; border-top-width: 3px; }
  .tr { right: 30px; top: 30px; border-right-width: 3px; border-top-width: 3px; }
  .bl { left: 30px; bottom: 30px; border-left-width: 3px; border-bottom-width: 3px; }
  .br { right: 30px; bottom: 30px; border-right-width: 3px; border-bottom-width: 3px; }
</style></head>
<body>
  <div class="photo"></div>
  <img class="logo" src="../assets/logo/chwispy-studio-horizontal.svg" alt="">
  <h1>Websites,<br>Shopify stores<br><span>&amp; video</span></h1>
  <p class="meta"><span>Inland Empire, Southern California</span><b>chwispystudio.com</b></p>
  <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
</body></html>
